name: Supabase QA
on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'tests/backend.mjs'
      - '.github/workflows/backend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start a disposable Supabase instance
        run: |
          supabase init
          sed -i 's/^project_id = .*/project_id = "tihoe-utro"/; s/^enable_anonymous_sign_ins = .*/enable_anonymous_sign_ins = true/' supabase/config.toml
          supabase start
      - name: Verify authentication, row policies and storage
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          convert -size 1x1 xc:white /tmp/tihoe-utro-test.jpg
          node tests/backend.mjs
