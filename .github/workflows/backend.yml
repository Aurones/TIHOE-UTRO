name: Supabase QA
on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'tests/backend.mjs'
      - '.github/workflows/backend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: 2.72.7
      - name: Start a disposable Supabase instance
        run: |
          supabase init
          sed -i 's/^project_id = .*/project_id = "tihoe-utro"/; s/^enable_anonymous_sign_ins = .*/enable_anonymous_sign_ins = false/; s/^enable_signup = .*/enable_signup = false/' supabase/config.toml
          if ! supabase start >/tmp/tihoe-supabase-start.log 2>&1; then
            grep -E '^Error|^ERROR|^Stopping|SQLSTATE|[Ff]ailed' /tmp/tihoe-supabase-start.log || true
            exit 1
          fi
      - name: Verify owner access, publication and private storage
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          printf '%s' '/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/wAALCAABAAEBAREA/8QAFAABAAAAAAAAAAAAAAAAAAAAB//EABQQAQAAAAAAAAAAAAAAAAAAAAD/2gAIAQEAAD8AZn//2Q==' | base64 -d >/tmp/tihoe-utro-test.jpg
          node tests/backend.mjs
